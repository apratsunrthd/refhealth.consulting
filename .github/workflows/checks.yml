name: Check readiness tool

on:
  pull_request:
  push:
    branches: [main]

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix mcp
      - run: npm test --prefix mcp
      - name: Check MCP download contents
        shell: bash
        run: |
          unzip -t readiness-mcp.zip
          for file in readiness-core.mjs mcp/server.mjs mcp/package.json mcp/package-lock.json mcp/sample-manifest.json mcp/README.md test/readiness.test.mjs mcp/test/server.test.mjs; do
            diff -q "$file" <(unzip -p readiness-mcp.zip "$file")
          done
